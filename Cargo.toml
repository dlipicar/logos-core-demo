[workspace]
members = ["demo-core", "headless", "app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
logos-rust-sdk = { git = "https://github.com/logos-co/logos-rust-sdk", rev = "54c6846e328161e40ebd4ca27af50f770f9b3f3a", features = ["host"] }
serde_json = "1"
demo-core = { path = "demo-core" }
