[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
logos-rust-sdk = { git = "https://github.com/logos-co/logos-rust-sdk", rev = "3311af8405de9993d1f01351d00d3254650a2cd1", features = ["host"] }
serde_json = "1"
demo-core = { path = "demo-core" }
